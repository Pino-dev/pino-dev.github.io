<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tournament Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #0f1117;
  --surf:   #1a1d27;
  --surf2:  #22263a;
  --accent: #00ff88;
  --gold:   #ffd700;
  --text:   #e8eaf0;
  --muted:  #6b7280;
  --ft: 'Barlow Condensed', system-ui, sans-serif;
  --fm: 'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: system-ui, sans-serif;
  background-color: var(--bg);
  /* gradiente radiale centrato per dare profondità */
  background-image: radial-gradient(ellipse 80% 60% at 50% 40%, #161b2e 0%, var(--bg) 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ── INTESTAZIONE ─────────────────────────────────────────── */
.hero {
  text-align: center;
  margin-bottom: 48px;
  animation: fadeUp .5s ease both;
}

.hero-title {
  font-family: var(--ft);
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  font-weight: 800;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--text);
}

.hero-title span { color: var(--accent); }

.hero-sub {
  font-family: var(--fm);
  font-size: clamp(.72rem, 2vw, .85rem);
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 10px;
}

/* ── CARDS ────────────────────────────────────────────────── */
.cards {
  display: flex;
  gap: 24px;
  width: 100%;
  max-width: 760px;
}

.card {
  flex: 1;
  background: var(--surf);
  border: 1px solid var(--surf2);
  border-radius: 16px;
  padding: 36px 28px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  position: relative;
  overflow: hidden;
  /* animazione entrata */
  animation: fadeUp .5s ease both;
}

.card:nth-child(1) { animation-delay: .15s; }
.card:nth-child(2) { animation-delay: .3s;  }

/* card attiva */
.card-active {
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  cursor: pointer;
}
.card-active:hover {
  border-color: var(--accent);
  box-shadow: 0 0 28px rgba(0, 255, 136, .18), 0 0 0 1px rgba(0,255,136,.15);
  transform: scale(1.02) translateY(-2px);
}

/* card disabilitata */
.card-disabled {
  opacity: .45;
  cursor: not-allowed;
  pointer-events: none;
}

/* badge coming soon */
.badge-soon {
  position: absolute;
  top: 18px; right: -28px;
  background: var(--gold);
  color: #000;
  font-family: var(--ft);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 4px 36px;
  transform: rotate(35deg);
  text-transform: uppercase;
}

/* icona */
.card-icon {
  font-size: 3.8rem;
  line-height: 1;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 12px rgba(0,255,136,.25));
}
.card-disabled .card-icon {
  filter: none;
}

/* testi */
.card-title {
  font-family: var(--ft);
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 2px;
}

.card-sub {
  font-family: var(--fm);
  font-size: .75rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.card-disabled .card-sub { color: var(--muted); }

.card-desc {
  font-size: .88rem;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 28px;
  max-width: 220px;
}

/* pulsante interno */
.card-btn {
  font-family: var(--ft);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 28px;
  border-radius: 8px;
  border: none;
  margin-top: auto;
}

.card-active .card-btn {
  background: var(--accent);
  color: #000;
  cursor: pointer;
}

.card-disabled .card-btn {
  background: var(--surf2);
  color: var(--muted);
  cursor: not-allowed;
}

/* linea decorativa sotto il titolo card */
.card-active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity .2s ease;
}
.card-active:hover::after { opacity: 1; }

/* ── FOOTER ───────────────────────────────────────────────── */
footer {
  margin-top: 48px;
  font-family: var(--fm);
  font-size: .68rem;
  color: #2d3148;
  letter-spacing: 1px;
  text-transform: uppercase;
  animation: fadeUp .5s .45s ease both;
}

/* ── ANIMAZIONE ───────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ───────────────────────────────────────────── */
@media (max-width: 600px) {
  .cards { flex-direction: column; max-width: 360px; }
  .hero  { margin-bottom: 36px; }
  .card  { padding: 28px 22px 26px; }
}
</style>
</head>
<body>

<!-- TITOLO -->
<header class="hero">
  <div class="hero-title">🏆 <span>TOURNAMENT</span> MANAGER</div>
  <div class="hero-sub">Scegli il formato del tuo torneo</div>
</header>

<!-- CARD -->
<main class="cards">

  <!-- Card 1: Round Robin (attiva) -->
  <a class="card card-active" href="roundrobin.html">
    <div class="card-icon">
      <!-- K5: grafo completo su 5 nodi ai vertici di un pentagono -->
      <!-- Centro (40,40), raggio 28 — N0(40,12) N1(66.6,31.4) N2(56.5,62.6) N3(23.5,62.6) N4(13.4,31.4) -->
      <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 1rem">
        <!-- 10 archi (prima dei nodi per z-order) -->
        <line x1="40"  y1="12"   x2="66.6" y2="31.4" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="40"  y1="12"   x2="56.5" y2="62.6" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="40"  y1="12"   x2="23.5" y2="62.6" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="40"  y1="12"   x2="13.4" y2="31.4" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="66.6" y1="31.4" x2="56.5" y2="62.6" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="66.6" y1="31.4" x2="23.5" y2="62.6" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="66.6" y1="31.4" x2="13.4" y2="31.4" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="56.5" y1="62.6" x2="23.5" y2="62.6" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="56.5" y1="62.6" x2="13.4" y2="31.4" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="23.5" y1="62.6" x2="13.4" y2="31.4" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
        <!-- 5 nodi -->
        <circle cx="40"   cy="12"   r="6" fill="#00ff88"/>
        <circle cx="66.6" cy="31.4" r="6" fill="#00ff88"/>
        <circle cx="56.5" cy="62.6" r="6" fill="#00ff88"/>
        <circle cx="23.5" cy="62.6" r="6" fill="#00ff88"/>
        <circle cx="13.4" cy="31.4" r="6" fill="#00ff88"/>
      </svg>
    </div>
    <div class="card-title">ALL'ITALIANA</div>
    <div class="card-sub">Round Robin</div>
    <p class="card-desc">Tutti contro tutti.</p>
    <div class="card-btn">INIZIA</div>
  </a>

  <!-- Card 2: Knockout (disabilitata) -->
  <div class="card card-disabled">
    <div class="badge-soon">Coming Soon</div>
    <div class="card-icon">
      <!-- Bracket 8 giocatori, 3 round — y slot: 5,15,25,35,45,55,65,75 -->
      <!-- midpoint R1: 10,30,50,70 | R2: 20,60 | Finale: 40 -->
      <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 1rem">
        <!-- Round 1: 8 linee orizzontali (slot giocatori) -->
        <line x1="4" y1="5"  x2="22" y2="5"  stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="15" x2="22" y2="15" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="25" x2="22" y2="25" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="35" x2="22" y2="35" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="45" x2="22" y2="45" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="55" x2="22" y2="55" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="65" x2="22" y2="65" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="75" x2="22" y2="75" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Round 1: 4 connettori verticali (coppie) -->
        <line x1="22" y1="5"  x2="22" y2="15" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="25" x2="22" y2="35" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="45" x2="22" y2="55" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="65" x2="22" y2="75" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Round 2: 4 linee orizzontali (ai midpoint R1) -->
        <line x1="22" y1="10" x2="46" y2="10" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="30" x2="46" y2="30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="50" x2="46" y2="50" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="70" x2="46" y2="70" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Round 2: 2 connettori verticali -->
        <line x1="46" y1="10" x2="46" y2="30" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="46" y1="50" x2="46" y2="70" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Finale: 2 linee orizzontali (ai midpoint R2) -->
        <line x1="46" y1="20" x2="64" y2="20" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <line x1="46" y1="60" x2="64" y2="60" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Finale: 1 connettore verticale (midpoint=40) -->
        <line x1="64" y1="20" x2="64" y2="60" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Connettore al vincitore -->
        <line x1="64" y1="40" x2="69" y2="40" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
        <!-- Stella vincitore (centro 73,40 r_ext=4 r_int=1.7) -->
        <path d="M73,36 L74,38.6 L76.8,38.8 L74.6,40.5 L75.4,43.2 L73,41.7 L70.6,43.2 L71.4,40.5 L69.2,38.8 L72,38.6 Z" fill="#ffd700"/>
      </svg>
    </div>
    <div class="card-title">ELIMINAZIONE</div>
    <div class="card-sub">Knockout</div>
    <p class="card-desc">Perdi ed esci. Solo il migliore sopravvive.</p>
    <div class="card-btn">PROSSIMAMENTE</div>
  </div>

</main>

<!-- FOOTER -->
<footer>Tournament Manager &mdash; v1.0</footer>

</body>
</html>
