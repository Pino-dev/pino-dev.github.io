<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ping Pong Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #0f1117;
  --surf:   #1a1d27;
  --surf2:  #22263a;
  --accent: #00ff88;
  --gold:   #ffd700;
  --text:   #e8eaf0;
  --muted:  #6b7280;
  --ft: 'Barlow Condensed', system-ui, sans-serif;
  --fm: 'DM Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: system-ui, sans-serif;
  background-color: var(--bg);
  /* gradiente radiale centrato per dare profondità */
  background-image: radial-gradient(ellipse 80% 60% at 50% 40%, #161b2e 0%, var(--bg) 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ── INTESTAZIONE ─────────────────────────────────────────── */
.hero {
  text-align: center;
  margin-bottom: 48px;
  animation: fadeUp .5s ease both;
}

.hero-title {
  font-family: var(--ft);
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  font-weight: 800;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--text);
}

.hero-title span { color: var(--accent); }

.hero-sub {
  font-family: var(--fm);
  font-size: clamp(.72rem, 2vw, .85rem);
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 10px;
}

/* ── CARDS ────────────────────────────────────────────────── */
.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  width: 100%;
  max-width: 1100px;
}

.card {
  flex: 1;
  background: var(--surf);
  border: 1px solid var(--surf2);
  border-radius: 16px;
  padding: 36px 28px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  text-decoration: none;
  color: var(--text);
  position: relative;
  overflow: hidden;
  /* animazione entrata */
  animation: fadeUp .5s ease both;
}

.card:nth-child(1) { animation-delay: .15s; }
.card:nth-child(2) { animation-delay: .3s;  }

/* card attiva */
.card-active {
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  cursor: pointer;
}
.card-active:hover {
  border-color: var(--accent);
  box-shadow: 0 0 28px rgba(0, 255, 136, .18), 0 0 0 1px rgba(0,255,136,.15);
  transform: scale(1.02) translateY(-2px);
}

/* card disabilitata */
.card-disabled {
  opacity: .45;
  cursor: not-allowed;
  pointer-events: none;
}

/* badge coming soon */
.badge-soon {
  position: absolute;
  top: 18px; right: -28px;
  background: var(--gold);
  color: #000;
  font-family: var(--ft);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: 1px;
  padding: 4px 36px;
  transform: rotate(35deg);
  text-transform: uppercase;
}

/* icona */
.card-icon {
  font-size: 3.8rem;
  line-height: 1;
  margin-bottom: 20px;
  filter: drop-shadow(0 0 12px rgba(0,255,136,.25));
}
.card-disabled .card-icon {
  filter: none;
}

/* testi */
.card-title {
  font-family: var(--ft);
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--text);
  margin-bottom: 2px;
}

.card-sub {
  font-family: var(--fm);
  font-size: .75rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.card-disabled .card-sub { color: var(--muted); }

.card-desc {
  font-size: .88rem;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 28px;
  max-width: 220px;
}

/* pulsante interno */
.card-btn {
  font-family: var(--ft);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 28px;
  border-radius: 8px;
  border: none;
  margin-top: auto;
}

.card-active .card-btn {
  background: var(--accent);
  color: #000;
  cursor: pointer;
}

.card-disabled .card-btn {
  background: var(--surf2);
  color: var(--muted);
  cursor: not-allowed;
}

/* linea decorativa sotto il titolo card */
.card-active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity .2s ease;
}
.card-active:hover::after { opacity: 1; }

/* ── FOOTER ───────────────────────────────────────────────── */
footer {
  margin-top: 48px;
  font-family: var(--fm);
  font-size: .68rem;
  color: #2d3148;
  letter-spacing: 1px;
  text-transform: uppercase;
  animation: fadeUp .5s .45s ease both;
}

/* ── ANIMAZIONE ───────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ───────────────────────────────────────────── */
@media (max-width: 800px) {
  .cards { grid-template-columns: 1fr; max-width: 360px; }
  .hero  { margin-bottom: 36px; }
  .card  { padding: 28px 22px 26px; }
}
</style>
</head>
<body>

<!-- TITOLO -->
<header class="hero">
  <div class="hero-title">🏓 <span>PING PONG</span> MANAGER</div>
  <div class="hero-sub">Scegli il formato del tuo torneo</div>
</header>

<!-- CARD -->
<main class="cards">

  <!-- Card 1: Round Robin (attiva) -->
  <a class="card card-active" href="roundrobin.html">
    <div class="card-icon">
      <!-- K5: grafo completo su 5 nodi ai vertici di un pentagono -->
      <!-- Centro (40,40), raggio 28 — N0(40,12) N1(66.6,31.4) N2(56.5,62.6) N3(23.5,62.6) N4(13.4,31.4) -->
      <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 1rem">
        <!-- Racchetta sinistra (inclinata verso il centro) -->
        <g transform="rotate(30, 18, 44)">
          <ellipse cx="18" cy="30" rx="12" ry="13" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="2"/>
          <ellipse cx="18" cy="30" rx="7"  ry="8"  fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.45"/>
          <rect x="14" y="43" width="8" height="18" rx="3" fill="#00ff88"/>
        </g>
        <!-- Racchetta destra (inclinata verso il centro, speculare) -->
        <g transform="rotate(-30, 62, 44)">
          <ellipse cx="62" cy="30" rx="12" ry="13" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="2"/>
          <ellipse cx="62" cy="30" rx="7"  ry="8"  fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.45"/>
          <rect x="58" y="43" width="8" height="18" rx="3" fill="#00ff88"/>
        </g>
        <!-- Pallina al centro -->
        <circle cx="40" cy="40" r="5.5" fill="#00ff88" fill-opacity="0.8"/>
        <circle cx="38.5" cy="38.5" r="1.5" fill="#fff" fill-opacity="0.35"/>
      </svg>
    </div>
    <div class="card-title">ALL'ITALIANA</div>
    <div class="card-sub">Round Robin</div>
    <p class="card-desc">Tutti contro tutti.</p>
    <div class="card-btn">INIZIA</div>
  </a>

  <!-- Card 2: Knockout -->
  <a class="card card-active" href="knockout.html">
    <div class="card-icon">
      <!-- Bracket 8 giocatori, 3 round — y slot: 5,15,25,35,45,55,65,75 -->
      <!-- midpoint R1: 10,30,50,70 | R2: 20,60 | Finale: 40 -->
      <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 1rem">
        <!-- Racchetta centrale (leggermente a sinistra per fare spazio alla stella) -->
        <ellipse cx="34" cy="29" rx="19" ry="20" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-width="2.5"/>
        <ellipse cx="34" cy="29" rx="11" ry="12" fill="none" stroke="#ffd700" stroke-width="1" stroke-opacity="0.4"/>
        <rect x="29" y="48" width="10" height="22" rx="4" fill="#ffd700"/>
        <!-- Pallina in alto a sinistra della racchetta -->
        <circle cx="20" cy="13" r="5.5" fill="#ffd700" fill-opacity="0.7"/>
        <circle cx="18.5" cy="11.5" r="1.5" fill="#fff" fill-opacity="0.3"/>
        <!-- Stella vincitore in alto a destra -->
        <path d="M66,7 L68,13 L74.5,13 L69.2,17.2 L71.2,23.2 L66,19.4 L60.8,23.2 L62.8,17.2 L57.5,13 L64,13 Z" fill="#ffd700"/>
      </svg>
    </div>
    <div class="card-title">ELIMINAZIONE</div>
    <div class="card-sub">Knockout</div>
    <p class="card-desc">Perdi ed esci. Solo il migliore sopravvive.</p>
    <div class="card-btn">INIZIA</div>
  </a>


</main>

<!-- FOOTER -->
<footer>Ping Pong Manager &mdash; v1.0</footer>

</body>
</html>
