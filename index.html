<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torneo ad Eliminazione Diretta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232635;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --winner: #22c55e;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: #2d3148;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
    header span { color: var(--accent); }

    /* ── Setup screen ── */
    #setup {
      max-width: 520px;
      margin: 3rem auto;
      padding: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #setup h2 { margin-bottom: 1.5rem; font-size: 1.1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .team-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }

    .team-row {
      display: flex;
      gap: 0.5rem;
    }

    .team-row input {
      flex: 1;
      padding: 0.55rem 0.8rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .team-row input:focus { border-color: var(--accent); }

    .team-row button {
      padding: 0.55rem 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .team-row button:hover { color: var(--accent2); border-color: var(--accent2); }

    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    button.primary {
      padding: 0.65rem 1.4rem;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.primary:hover { opacity: 0.85; }

    button.secondary {
      padding: 0.65rem 1.4rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    button.secondary:hover { color: var(--text); border-color: var(--text); }

    .hint { font-size: 0.82rem; color: var(--muted); margin-top: 0.75rem; }

    /* ── Bracket screen ── */
    #bracket-screen { display: none; padding: 1.5rem 2rem 4rem; }

    .bracket-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .bracket-header h2 { font-size: 1.2rem; }

    #winner-banner {
      display: none;
      background: linear-gradient(135deg, #22c55e22, #22c55e44);
      border: 1px solid var(--winner);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--winner);
    }

    /* bracket layout */
    #bracket {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 1rem;
      align-items: flex-start;
    }

    .round {
      display: flex;
      flex-direction: column;
      min-width: 180px;
    }

    .round-title {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 0.4rem 0;
      margin-bottom: 0.5rem;
    }

    .round-matches {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* spacer trick: each match is wrapped in a cell that distributes space evenly */
    .match-cell {
      display: flex;
      align-items: center;
      flex: 1;
      position: relative;
    }

    .match {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      width: 160px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .team {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.7rem;
      gap: 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
      min-height: 36px;
    }
    .team:last-child { border-bottom: none; }
    .team:hover:not(.tbd):not(.winner) { background: var(--surface2); }
    .team.winner { background: #22c55e18; color: var(--winner); font-weight: 700; }
    .team.tbd { color: var(--muted); cursor: default; font-style: italic; font-size: 0.8rem; }
    .team.eliminated { opacity: 0.38; text-decoration: line-through; }

    .seed {
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 4px;
      padding: 0 4px;
      min-width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .team.winner .seed { background: #22c55e33; color: var(--winner); }

    /* connector lines */
    .connector {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      width: 20px;
      height: 100%;
      position: absolute;
      right: -20px;
      top: 0;
      pointer-events: none;
    }

    /* simple SVG connectors drawn per round */
    .round + .round { position: relative; }

    /* modal */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000a;
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 360px;
      max-width: 95vw;
    }

    #modal h3 { margin-bottom: 1.25rem; font-size: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .modal-teams { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }

    .modal-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 1rem;
    }
    .modal-team:hover { border-color: var(--accent); background: #6c63ff18; }
    .modal-team .badge { font-size: 0.75rem; color: var(--muted); }

    #modal-cancel { width: 100%; }

    .btn-print {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.4rem;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px #6c63ff44;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .btn-print:hover { opacity: 0.85; }

    @media print {
      header, #setup, .bracket-header, .btn-print, #modal-overlay { display: none !important; }
      body { background: #fff; color: #000; }
      #bracket-screen { display: block !important; padding: 0; }
      #winner-banner { border-color: #22c55e; color: #16a34a; background: #f0fdf4; }
      .match { border-color: #ccc; background: #fff; }
      .team { border-color: #eee; color: #000; }
      .team.winner { background: #f0fdf4; color: #16a34a; }
      .team.eliminated { opacity: 0.4; }
      .round-title { color: #666; }
      .seed { background: #f3f4f6; color: #666; }
    }
  </style>
</head>
<body>

<header>
  <h1>TORNEO AD <span>ELIMINAZIONE DIRETTA</span></h1>
</header>

<!-- SETUP -->
<div id="setup">
  <h2>Crea il torneo</h2>
  <div class="team-list" id="team-list"></div>
  <div class="btn-row" style="margin-bottom:1rem">
    <button class="secondary" onclick="addTeamRow()">+ Aggiungi squadra</button>
  </div>
  <div class="btn-row">
    <button class="primary" onclick="startTournament()">Genera tabellone</button>
    <button class="secondary" onclick="loadDemo()">Demo (8 squadre)</button>
  </div>
  <p class="hint">Servono almeno 2 squadre. Il numero viene arrotondato alla prossima potenza di 2 (bye automatici).</p>
</div>

<!-- BRACKET -->
<div id="bracket-screen">
  <div class="bracket-header">
    <h2 id="bracket-title">Torneo</h2>
    <div class="btn-row">
      <button class="secondary" onclick="resetTournament()">← Ricomincia</button>
    </div>
  </div>
  <div id="winner-banner"></div>
  <div id="bracket"></div>
  <button class="btn-print" onclick="window.print()">🖨 Stampa</button>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3>Scegli il vincitore</h3>
    <div class="modal-teams" id="modal-teams"></div>
    <button class="secondary" id="modal-cancel" onclick="closeModal()">Annulla</button>
  </div>
</div>

<script>
  /* ── State ── */
  let rounds = [];        // rounds[r][m] = { t1, t2, winner, seed1, seed2 }
  let pendingMatch = null; // { r, m }

  /* ── Setup helpers ── */
  function addTeamRow(val = '') {
    const list = document.getElementById('team-list');
    const row = document.createElement('div');
    row.className = 'team-row';
    row.innerHTML = `
      <input type="text" placeholder="Nome Squadra o Partecipante" value="${val}" />
      <button onclick="this.parentElement.remove()" title="Rimuovi">✕</button>
    `;
    list.appendChild(row);
    row.querySelector('input').focus();
  }

  function loadDemo() {
    document.getElementById('team-list').innerHTML = '';
    ['Aquile', 'Leoni', 'Tigri', 'Draghi', 'Falchi', 'Lupi', 'Orsi', 'Squali'].forEach(t => addTeamRow(t));
  }

  /* ── Tournament logic ── */
  function nextPow2(n) {
    let p = 1;
    while (p < n) p <<= 1;
    return p;
  }

  function startTournament() {
    const inputs = [...document.querySelectorAll('#team-list input')];
    const names = inputs.map(i => i.value.trim()).filter(Boolean);
    if (names.length < 2) { alert('Inserisci almeno 2 squadre!'); return; }

    const size = nextPow2(names.length);
    // shuffle for seeding
    for (let i = names.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [names[i], names[j]] = [names[j], names[i]];
    }
    // pad with byes
    while (names.length < size) names.push(null);

    // build first round matches
    const firstRound = [];
    for (let i = 0; i < size; i += 2) {
      const dead = !names[i] && !names[i + 1];
      const match = { t1: names[i], t2: names[i + 1], winner: null, seed1: i + 1, seed2: i + 2, dead };
      if (!dead) {
        if (!match.t1) match.winner = match.t2;
        else if (!match.t2) match.winner = match.t1;
      }
      firstRound.push(match);
    }

    const totalRounds = Math.log2(size);
    rounds = [firstRound];
    for (let r = 1; r < totalRounds; r++) {
      const prev = rounds[r - 1];
      const cur = [];
      for (let m = 0; m < prev.length; m += 2) {
        cur.push({ t1: null, t2: null, winner: null, seed1: null, seed2: null, dead: false });
      }
      rounds.push(cur);
    }

    // propagate byes
    propagateWinners();
    render();
    document.getElementById('setup').style.display = 'none';
    document.getElementById('bracket-screen').style.display = 'block';
    document.getElementById('bracket-title').textContent = `Torneo (${names.filter(Boolean).length} squadre)`;
  }

  function propagateWinners() {
    let changed = true;
    while (changed) {
      changed = false;
      for (let r = 0; r < rounds.length - 1; r++) {
        for (let m = 0; m < rounds[r].length; m += 2) {
          const ma = rounds[r][m];
          const mb = rounds[r][m + 1];
          const next = rounds[r + 1][m / 2];
          const w1 = ma?.winner ?? null;
          const w2 = mb?.winner ?? null;
          const s1 = w1 ? (w1 === ma.t1 ? ma.seed1 : ma.seed2) : null;
          const s2 = w2 ? (w2 === mb.t1 ? mb.seed1 : mb.seed2) : null;
          const newDead = (ma.dead === true) && (mb.dead === true);

          if (next.t1 !== w1 || next.t2 !== w2 || next.dead !== newDead) {
            next.t1 = w1; next.t2 = w2;
            next.seed1 = s1; next.seed2 = s2;
            next.dead = newDead;
            if (next.winner && next.winner !== next.t1 && next.winner !== next.t2) next.winner = null;
            changed = true;
          }

          // auto-advance solo se lo slot avversario viene da una partita morta (bye permanente)
          if (next.t1 && !next.t2 && mb.dead && next.winner !== next.t1) { next.winner = next.t1; changed = true; }
          else if (next.t2 && !next.t1 && ma.dead && next.winner !== next.t2) { next.winner = next.t2; changed = true; }
          else if (!next.t1 && !next.t2 && next.winner) { next.winner = null; changed = true; }
        }
      }
    }
  }

  /* ── Render ── */
  function activeRound() {
    for (let r = 0; r < rounds.length; r++) {
      if (rounds[r].some(m => !m.dead && !m.winner && (m.t1 || m.t2))) return r;
    }
    return rounds.length - 1;
  }

  const ROUND_NAMES = ['Primo Turno', 'Secondo Turno', 'Quarti', 'Semifinali', 'Finale', 'Finale'];

  function roundLabel(r, total) {
    const fromEnd = total - 1 - r;
    if (fromEnd === 0) return 'Finale';
    if (fromEnd === 1) return 'Semifinali';
    if (fromEnd === 2) return 'Quarti';
    if (fromEnd === 3) return 'Ottavi';
    return `Turno ${r + 1}`;
  }

  function render() {
    const el = document.getElementById('bracket');
    el.innerHTML = '';

    rounds.forEach((matches, r) => {
      const roundEl = document.createElement('div');
      roundEl.className = 'round';

      const title = document.createElement('div');
      title.className = 'round-title';
      title.textContent = roundLabel(r, rounds.length);
      roundEl.appendChild(title);

      const matchesEl = document.createElement('div');
      matchesEl.className = 'round-matches';
      matchesEl.style.minHeight = `${Math.max(matches.length, 1) * 90}px`;

      matches.forEach((match, m) => {
        const cell = document.createElement('div');
        cell.className = 'match-cell';
        cell.style.flex = `${Math.pow(2, r)}`;

        // partita completamente vuota: spacer invisibile
        if (!match.t1 && !match.t2) {
          cell.style.visibility = 'hidden';
          matchesEl.appendChild(cell);
          return;
        }

        const matchEl = document.createElement('div');
        matchEl.className = 'match';

        [1, 2].forEach(n => {
          const team = match[`t${n}`];
          const seed = match[`seed${n}`];
          const teamEl = document.createElement('div');
          teamEl.className = 'team';

          if (!team) {
            teamEl.classList.add('tbd');
            // BYE = slot permanentemente vuoto; TBD = in attesa del risultato di un match
            teamEl.textContent = match.winner ? 'BYE' : 'TBD';
          } else {
            if (match.winner === team) teamEl.classList.add('winner');
            else if (match.winner && match.winner !== team) teamEl.classList.add('eliminated');

            const seedSpan = document.createElement('span');
            seedSpan.className = 'seed';
            seedSpan.textContent = seed || '?';
            teamEl.appendChild(seedSpan);
            teamEl.appendChild(document.createTextNode(team));

            // click solo se partita reale (non bye) e non ancora decisa
            if (!match.winner && match.t1 && match.t2) {
              teamEl.onclick = () => openModal(r, m);
            }
          }
          matchEl.appendChild(teamEl);
        });

        cell.appendChild(matchEl);
        matchesEl.appendChild(cell);
      });

      roundEl.appendChild(matchesEl);
      el.appendChild(roundEl);
    });

    checkFinalWinner();
  }

  function checkFinalWinner() {
    const finalMatch = rounds[rounds.length - 1][0];
    const banner = document.getElementById('winner-banner');
    if (finalMatch?.winner) {
      banner.style.display = 'block';
      banner.textContent = `🏆 Campione: ${finalMatch.winner}`;
    } else {
      banner.style.display = 'none';
    }
  }

  /* ── Modal ── */
  function openModal(r, m) {
    const match = rounds[r][m];
    if (!match.t1 || !match.t2 || match.winner) return;
    pendingMatch = { r, m };

    const teamsEl = document.getElementById('modal-teams');
    teamsEl.innerHTML = '';

    [match.t1, match.t2].forEach((t, i) => {
      const btn = document.createElement('div');
      btn.className = 'modal-team';
      btn.innerHTML = `<span>${t}</span><span class="badge">seed ${i === 0 ? match.seed1 : match.seed2}</span>`;
      btn.onclick = () => selectWinner(t);
      teamsEl.appendChild(btn);
    });

    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    pendingMatch = null;
  }

  function selectWinner(team) {
    if (!pendingMatch) return;
    const { r, m } = pendingMatch;
    rounds[r][m].winner = team;
    propagateWinners();
    closeModal();
    render();
  }

  /* ── Reset ── */
  function resetTournament() {
    rounds = [];
    document.getElementById('bracket-screen').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
  }

  /* ── Init: start with 4 empty rows ── */
  for (let i = 0; i < 4; i++) addTeamRow();
</script>
</body>
</html>
