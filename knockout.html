<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Eliminazione Diretta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #0f1117;
  --surf:   #1a1d27;
  --surf2:  #22263a;
  --accent: #00ff88;
  --gold:   #ffd700;
  --silver: #c0c0c0;
  --text:   #e8eaf0;
  --muted:  #6b7280;
  --danger: #ef4444;
  --ok-bg:  #081a0e;
  --ok-bdr: #00ff88;
  --ft: 'Barlow Condensed', system-ui, sans-serif;
  --fm: 'DM Mono', monospace;
  --conn: 20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }

.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transform: translateY(14px);
  transition: opacity .3s ease, transform .3s ease;
}
.screen.active { opacity: 1; pointer-events: all; transform: none; }
.no-trans .screen { transition: none !important; }

.modal-bg {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.78);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: var(--surf); border: 1px solid var(--surf2);
  border-radius: 14px; padding: 32px 28px;
  max-width: 380px; width: 92%; text-align: center;
}
.modal-box h3 {
  font-family: var(--ft); font-size: 1.5rem; font-weight: 800;
  color: var(--accent); margin-bottom: 16px;
}
.modal-box p { color: var(--muted); font-size: .9rem; line-height: 1.5; margin-bottom: 24px; }
.modal-btns { display: flex; gap: 10px; justify-content: center; }

.btn {
  font-family: inherit; font-size: .875rem; font-weight: 600;
  padding: 9px 22px; border-radius: 8px; border: none;
  cursor: pointer; white-space: nowrap;
  transition: background .18s, transform .12s;
}
.btn:active { transform: scale(.97); }
.btn-primary   { background: var(--accent); color: #000; }
.btn-primary:hover { background: #1fffa0; }
.btn-secondary { background: var(--surf2); color: var(--text); }
.btn-secondary:hover { background: #2d3148; }
.btn-sm { padding: 5px 12px; font-size: .78rem; }

/* ── SETUP ── */
#screen-setup {
  align-items: center; justify-content: flex-start;
  overflow-y: auto; padding: 60px 16px 48px;
}
.setup-card {
  background: var(--surf); border: 1px solid var(--surf2);
  border-radius: 14px; padding: 36px 40px;
  width: 100%; max-width: 520px;
}
.setup-title {
  font-family: var(--ft); font-size: 2.2rem; font-weight: 800;
  color: var(--gold); letter-spacing: 1px;
  text-align: center; margin-bottom: 28px;
}
.fg { margin-bottom: 18px; }
.fg label {
  display: block; font-size: .7rem; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: .9px; margin-bottom: 6px;
}
.fg input {
  width: 100%; padding: 10px 14px;
  background: var(--surf2); border: 1px solid #2d3148;
  border-radius: 8px; color: var(--text);
  font-family: inherit; font-size: .95rem;
  transition: border-color .2s;
}
.fg input:focus { outline: none; border-color: var(--gold); }
.fg input.err   { border-color: var(--danger); }

.count-row { display: flex; align-items: center; gap: 10px; }
.count-val {
  font-family: var(--fm); font-size: 1.4rem; font-weight: 700;
  color: var(--gold); min-width: 36px; text-align: center;
}
.btn-step {
  width: 34px; height: 34px; border-radius: 8px; border: none;
  background: var(--surf2); color: var(--text);
  font-size: 1.2rem; cursor: pointer; transition: background .15s;
}
.btn-step:hover { background: #2d3148; }
.count-hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
.bye-note {
  font-size: .75rem; color: var(--muted);
  background: var(--surf2); border-radius: 6px;
  padding: 8px 12px; margin-bottom: 16px; display: none;
}
.bye-note.show { display: block; }

.players-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 22px;
}
.pf { display: flex; flex-direction: column; gap: 4px; }
.pf label {
  font-size: .68rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .7px;
}
.pf input {
  padding: 8px 12px; background: var(--surf2);
  border: 1px solid #2d3148; border-radius: 8px;
  color: var(--text); font-family: inherit; font-size: .9rem;
  transition: border-color .2s;
}
.pf input:focus { outline: none; border-color: var(--gold); }
.pf input.err   { border-color: var(--danger); }
.err-msg { color: var(--danger); font-size: .8rem; min-height: 1.2em; margin-bottom: 12px; }

/* ── HEADER ── */
.game-hdr {
  flex-shrink: 0;
  background: var(--surf); border-bottom: 2px solid var(--gold);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 12px; z-index: 10;
}
.game-hdr h1 {
  font-family: var(--ft); font-size: 1.5rem; font-weight: 800;
  color: var(--gold); letter-spacing: 1px;
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hdr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.prog-txt  { font-family: var(--fm); font-size: .75rem; color: var(--muted); }

/* ── BRACKET ── */
#screen-bracket { overflow: hidden; }
.bracket-body { flex: 1; overflow: auto; padding: 20px; }

.bracket {
  display: flex; gap: 0;
  min-height: 400px; width: max-content; min-width: 100%;
}

.bracket-col {
  display: flex; flex-direction: column;
  min-width: 170px;
}

.round-label {
  font-family: var(--ft); font-size: .72rem; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px;
  text-align: center; padding: 0 var(--conn) 10px;
  border-bottom: 1px solid var(--surf2); flex-shrink: 0;
}

.round-matches { flex: 1; display: flex; flex-direction: column; }

.match-pair {
  flex: 1; display: flex; flex-direction: column;
  position: relative;
}
/* Vertical connector on right, linking midpoints of the two child matches */
.match-pair::after {
  content: ''; position: absolute;
  right: 0; top: 25%; height: 50%;
  border-right: 2px solid var(--surf2);
  pointer-events: none;
}
.bracket-col.final-col .match-pair::after { display: none; }

.match-slot {
  flex: 1; display: flex; align-items: center;
  padding: 6px var(--conn); position: relative;
  min-height: 72px;
}
/* Left horizontal connector */
.match-slot::before {
  content: ''; position: absolute;
  left: 0; top: 50%; width: var(--conn);
  border-top: 2px solid var(--surf2); pointer-events: none;
}
/* Right horizontal connector */
.match-slot::after {
  content: ''; position: absolute;
  right: 0; top: 50%; width: var(--conn);
  border-top: 2px solid var(--surf2); pointer-events: none;
}
.bracket-col.first-col .match-slot::before { display: none; }
.bracket-col.final-col .match-slot::after  { display: none; }

/* Match card */
.match-card {
  width: 100%; background: var(--surf);
  border: 1px solid var(--surf2);
  border-radius: 8px; overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.match-card.playable {
  cursor: pointer; border-color: rgba(255,215,0,.3);
}
.match-card.playable:hover {
  border-color: var(--gold);
  box-shadow: 0 0 14px rgba(255,215,0,.2);
}
.match-card.played  { border-color: var(--ok-bdr); background: var(--ok-bg); }
.match-card.bye-card { opacity: .25; pointer-events: none; }
.match-card.pending  { opacity: .45; }

.mc-player {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; gap: 6px; font-size: .8rem;
}
.mc-player + .mc-player { border-top: 1px solid var(--surf2); }
.mc-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.mc-score { font-family: var(--fm); font-size: .85rem; min-width: 18px; text-align: right; color: var(--muted); }
.mc-player.winner .mc-name  { color: var(--accent); }
.mc-player.winner .mc-score { color: var(--accent); font-weight: 700; }
.mc-player.loser  { opacity: .4; }
.mc-player.empty .mc-name  { color: var(--muted); font-style: italic; font-weight: 400; }

/* ── SCORE MODAL ── */
#modal-score .modal-box { max-width: 340px; }
.score-inputs {
  display: flex; align-items: center; gap: 12px;
  justify-content: center; margin-bottom: 8px;
}
.score-inp-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.score-inp-name {
  font-family: var(--ft); font-size: .95rem; font-weight: 700;
  max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.score-inp {
  width: 62px; height: 50px; text-align: center;
  font-family: var(--fm); font-size: 1.5rem; font-weight: 700;
  background: var(--surf2); border: 2px solid #2d3148;
  border-radius: 10px; color: var(--text);
  -moz-appearance: textfield; transition: border-color .2s;
}
.score-inp::-webkit-outer-spin-button,
.score-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
.score-inp:focus { outline: none; border-color: var(--gold); }
.score-vs { font-family: var(--fm); color: var(--muted); font-size: 1rem; }
.score-error { color: var(--danger); font-size: .8rem; min-height: 1.2em; margin-bottom: 12px; }

/* ── WINNER ── */
#screen-winner {
  align-items: center; justify-content: flex-start;
  overflow-y: auto; padding: 40px 16px 48px; text-align: center;
}
.w-inner {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 480px; margin: 0 auto;
}
.trophy-ico { font-size: 4.5rem; display: block; margin-bottom: 10px; animation: rock 2.5s ease-in-out infinite; }
@keyframes rock { 0%,100%{transform:rotate(-7deg) scale(1)} 50%{transform:rotate(7deg) scale(1.06)} }
.w-label { font-family: var(--ft); font-size: 1rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 4px; }
.w-event { font-family: var(--ft); font-size: .9rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.w-name  {
  font-family: var(--ft); font-size: clamp(2.6rem, 9vw, 5rem);
  font-weight: 800; color: var(--gold); line-height: 1.1;
  margin-bottom: 10px; animation: glow 2s ease-in-out infinite;
}
@keyframes glow { 0%,100%{text-shadow:0 0 18px rgba(255,215,0,.4)} 50%{text-shadow:0 0 42px rgba(255,215,0,.95)} }
.w-runner { font-family: var(--ft); font-size: 1.1rem; color: var(--silver); margin-bottom: 28px; }
.w-runner span { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 2px; }
.w-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.confetti-box { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bit { position: absolute; top: -24px; border-radius: 2px; animation: cfall linear infinite; }
@keyframes cfall { to { transform: translateY(110vh) rotate(760deg); opacity: 0; } }

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .setup-card { padding: 24px 18px; }
  .players-grid { grid-template-columns: 1fr; }
  .bracket-col { min-width: 140px; }
}

/* ── PRINT ── */
@media print {
  html, body { height: auto; overflow: visible; background: #fff; color: #000; }
  .screen { position: static !important; opacity: 1 !important; transform: none !important; pointer-events: all !important; display: none !important; overflow: visible !important; height: auto !important; }
  .screen.active { display: flex !important; }
  .bracket-body { overflow: visible; }
  .btn, .hdr-right, .confetti-box, .modal-bg { display: none !important; }

  /* Bracket */
  .game-hdr { background: #fff; border-bottom: 2px solid #000; }
  .game-hdr h1 { color: #000; }
  .match-card { background: #fff !important; border: 1px solid #ccc !important; break-inside: avoid; }
  .match-card.played { background: #f0fff4 !important; }
  .mc-player { color: #000; }
  .mc-player.winner .mc-name { color: #000 !important; font-weight: 800; }
  .mc-player.loser { opacity: .55; }
  .mc-score { color: #555 !important; }
  .match-slot::before, .match-slot::after { border-color: #ccc; }
  .match-pair::after { border-color: #ccc; }
  .round-label { color: #555; border-color: #ccc; }

  /* Vincitore */
  #screen-winner { justify-content: center; padding: 40px 20px; }
  .trophy-ico { animation: none !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .w-label { color: #555 !important; }
  .w-event { color: #555 !important; }
  .w-name  { color: #000 !important; text-shadow: none !important; animation: none !important; font-size: 3.5rem; }
  .w-runner { color: #333 !important; }
  .w-runner span { color: #555 !important; }
  .w-btns { display: none !important; }
}
</style>
</head>
<body>

<!-- MODAL RESUME -->
<div class="modal-bg" id="modal-resume">
  <div class="modal-box">
    <h3>Torneo in corso</h3>
    <p id="modal-resume-msg"></p>
    <div class="modal-btns">
      <button class="btn btn-primary"   onclick="onResumeYes()">Sì, riprendi</button>
      <button class="btn btn-secondary" onclick="onResumeNo()">No, nuovo torneo</button>
    </div>
  </div>
</div>

<!-- MODAL PUNTEGGIO -->
<div class="modal-bg" id="modal-score">
  <div class="modal-box">
    <h3 id="modal-score-title">Punteggio</h3>
    <div class="score-inputs">
      <div class="score-inp-wrap">
        <div class="score-inp-name" id="score-name-a">—</div>
        <input class="score-inp" id="score-inp-a" type="number" min="0" max="999" placeholder="0"/>

      <div class="score-vs">–</div>
      <div class="score-inp-wrap">

      </div>
    </div>
    <div class="score-error" id="score-error"></div>
    <div class="modal-btns">
      <button class="btn btn-primary"   onclick="confirmScore()">Conferma</button>
      <button class="btn btn-secondary" onclick="closeScoreModal()">Annulla</button>
    </div>
  </div>
</div>

<div class="confetti-box" id="confetti"></div>

<!-- SCHERMATA 1: SETUP -->
<div id="screen-setup" class="screen">
  <div class="setup-card">
    <div class="setup-title">
      <svg width="44" height="44" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;margin-right:.4rem">
        <line x1="4" y1="5"  x2="22" y2="5"  stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>

        <line x1="4" y1="35" x2="22" y2="35" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>

        <line x1="4" y1="55" x2="22" y2="55" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>

      </svg>
      ELIMINAZIONE

    <div class="fg">
      <label>Nome del torneo</label>
      <input id="inp-tname" type="text" placeholder="es. Champions di Quartiere" maxlength="40"/>

    <div class="fg">
      <label>Numero di partecipanti</label>
      <div class="count-row">
        <button class="btn-step" onclick="adjustCount(-1)">−</button>
        <div class="count-val" id="count-display">4</div>
        <button class="btn-step" onclick="adjustCount(1)">+</button>

<!-- SCHERMATA 2: TABELLONE -->
<div id="screen-bracket" class="screen">
  <header class="game-hdr">
    <h1 id="bracket-title">TORNEO</h1>
    <div class="hdr-right">
      <span class="prog-txt" id="bracket-prog"></span>
      <button class="btn btn-secondary btn-sm" onclick="resetTournament()">Reset</button>
    </div>
  </header>
  <div class="bracket-body">
    <div class="bracket" id="bracket-wrap"></div>
  </div>
</div>

<!-- SCHERMATA 3: VINCITORE -->
<div id="screen-winner" class="screen">
  <div class="w-inner">
    <span class="trophy-ico">🏆</span>
    <div class="w-label">Campione</div>
    <div class="w-event" id="w-event-name"></div>
    <div class="w-name"  id="w-champion"></div>
    <div class="w-runner">
      <span>Finalista</span>
      <span id="w-runner"></span>
    </div>
    <div class="w-btns">
      <button class="btn btn-secondary" onclick="printBracket()">Stampa Tabellone</button>
      <button class="btn btn-primary"   onclick="newTournament()">Nuovo Torneo</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'knockout_v1';
const BYE = '__BYE__';
let S = null;
let pendingMatch = null;

/* ── UTILS ── */
function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function roundName(r, numRounds) {
  const left = numRounds - 1 - r;
  if (left === 0) return 'Finale';
  if (left === 1) return 'Semifinale';
  if (left === 2) return 'Quarti di Finale';
  if (left === 3) return 'Ottavi di Finale';
  if (left === 4) return 'Sedicesimi di Finale';
  return `Turno ${r + 1}`;
}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } }

/* ── SETUP UI ── */
let playerCount = 4;

function adjustCount(d) {
  const n = playerCount + d;
  if (n < 2 || n > 32) return;
  playerCount = n;
  refreshSetup();
}

function refreshSetup() {
  document.getElementById('count-display').textContent = playerCount;
  const pow2 = nextPow2(playerCount);
  const hint = document.getElementById('count-hint');
  const note = document.getElementById('bye-note');
  if (pow2 === playerCount) {
    hint.textContent = 'Potenza di 2 ✓';
    hint.style.color = 'var(--accent)';
    note.classList.remove('show');
  } else {
    const b = pow2 - playerCount;
    hint.textContent = `Prossima potenza di 2: ${pow2}`;
    hint.style.color = 'var(--muted)';
    note.textContent = `${b} ${b > 1 ? 'giocatori passeranno' : 'giocatore passerà'} automaticamente al turno successivo (bye).`;
    note.classList.add('show');
  }
  buildPlayerFields();
}

function buildPlayerFields() {
  const grid = document.getElementById('players-grid');
  const prev = [...grid.querySelectorAll('input')].map(i => i.value);
  let h = '';
  for (let i = 0; i < playerCount; i++) {
    h += `<div class="pf"><label>Giocatore ${i + 1}</label>
      <input id="pf-${i}" type="text" placeholder="Nome ${i + 1}" maxlength="20" value="${prev[i] || ''}"/></div>`;
  }
  grid.innerHTML = h;
}

function startTournament() {
  const name = document.getElementById('inp-tname').value.trim();
  const err  = document.getElementById('setup-err');
  if (!name) { err.textContent = 'Inserisci il nome del torneo.'; return; }

  const players = [];
  for (let i = 0; i < playerCount; i++) {
    const v = document.getElementById(`pf-${i}`).value.trim();
    if (!v) { err.textContent = `Inserisci il nome del giocatore ${i + 1}.`; return; }
    players.push(v);
  }
  if (new Set(players).size !== players.length) { err.textContent = 'Ci sono nomi duplicati.'; return; }
  err.textContent = '';
  buildBracket(name, players);
}

/* ── BRACKET LOGIC ── */
function buildBracket(name, players) {
  const shuffled = shuffle(players);
  const pow2     = nextPow2(shuffled.length);
  const numRounds = Math.log2(pow2);
  const nBye     = pow2 - shuffled.length;

  // Seed: first nBye pairs are (player, BYE), rest are (player, player)
  const slots = [];
  for (let i = 0; i < nBye; i++) { slots.push(shuffled[i]); slots.push(BYE); }
  for (let i = nBye; i < shuffled.length; i++) slots.push(shuffled[i]);

  const bracket = [];
  // Round 0
  const r0 = [];
  for (let i = 0; i < pow2; i += 2)
    r0.push({ a: slots[i], b: slots[i + 1], scoreA: null, scoreB: null, winner: null });
  bracket.push(r0);
  // Remaining rounds
  for (let r = 1; r < numRounds; r++) {
    const cnt = pow2 / Math.pow(2, r + 1);
    bracket.push(Array.from({ length: cnt }, () =>
      ({ a: null, b: null, scoreA: null, scoreB: null, winner: null })));
  }

  S = { name, players, bracket, numRounds };
  autoAdvanceByes();
  save();
  showBracketScreen();
}

function autoAdvanceByes() {
  S.bracket.forEach((round, r) => {
    round.forEach((m, i) => {
      if (m.winner) return;
      if (m.b === BYE && m.a && m.a !== BYE) { m.winner = m.a; advanceWinner(r, i, m.a); }
      else if (m.a === BYE && m.b && m.b !== BYE) { m.winner = m.b; advanceWinner(r, i, m.b); }
    });
  });
}

function advanceWinner(round, matchIdx, winner) {
  if (round + 1 >= S.numRounds) return;
  const next  = S.bracket[round + 1][Math.floor(matchIdx / 2)];
  const isTop = matchIdx % 2 === 0;
  if (isTop) next.a = winner; else next.b = winner;
}

/* ── SCORE MODAL ── */
function openScoreModal(r, i) {
  const m = S.bracket[r][i];
  if (!m.a || !m.b || m.a === BYE || m.b === BYE || m.winner) return;
  pendingMatch = { r, i };
  document.getElementById('score-name-a').textContent = m.a;
  document.getElementById('score-name-b').textContent = m.b;
  document.getElementById('score-inp-a').value = m.scoreA !== null ? m.scoreA : '';
  document.getElementById('score-inp-b').value = m.scoreB !== null ? m.scoreB : '';
  document.getElementById('score-error').textContent = '';
  document.getElementById('modal-score-title').textContent = `${m.a}  vs  ${m.b}`;
  document.getElementById('modal-score').classList.add('open');
  setTimeout(() => document.getElementById('score-inp-a').focus(), 80);
}

function closeScoreModal() {
  document.getElementById('modal-score').classList.remove('open');
  pendingMatch = null;
}

function confirmScore() {
  if (!pendingMatch) return;
  const { r, i } = pendingMatch;
  const m  = S.bracket[r][i];
  const sa = parseInt(document.getElementById('score-inp-a').value, 10);
  const sb = parseInt(document.getElementById('score-inp-b').value, 10);
  const err = document.getElementById('score-error');
  if (isNaN(sa) || isNaN(sb) || sa < 0 || sb < 0) { err.textContent = 'Inserisci punteggi validi (≥ 0).'; return; }
  if (sa === sb) { err.textContent = 'Pareggio non ammesso — usa i rigori o un supplementare.'; return; }
  m.scoreA = sa; m.scoreB = sb;
  m.winner = sa > sb ? m.a : m.b;
  advanceWinner(r, i, m.winner);
  autoAdvanceByes();
  save();
  closeScoreModal();
  renderBracket();
  updateProgress();
  checkDone();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('modal-score').classList.contains('open')) confirmScore();
  if (e.key === 'Escape') { closeScoreModal(); document.getElementById('modal-resume').classList.remove('open'); }
});

/* ── RENDER ── */
function renderBracket() {
  const { bracket, numRounds } = S;
  let h = '';
  for (let r = 0; r < numRounds; r++) {
    const first = r === 0, last = r === numRounds - 1;
    h += `<div class="bracket-col${first ? ' first-col' : ''}${last ? ' final-col' : ''}">`;
    h += `<div class="round-label">${roundName(r, numRounds)}</div>`;
    h += `<div class="round-matches">`;
    const matches = bracket[r];
    for (let i = 0; i < matches.length; i += last ? 1 : 2) {
      h += `<div class="match-pair">`;
      h += matchSlotHTML(r, i, matches[i]);
      if (!last && i + 1 < matches.length) h += matchSlotHTML(r, i + 1, matches[i + 1]);
      h += `</div>`;
    }
    h += `</div></div>`;
  }
  document.getElementById('bracket-wrap').innerHTML = h;
}

function matchSlotHTML(r, i, m) {
  const isBye      = m.a === BYE || m.b === BYE;
  const isPlayable = m.a && m.b && !isBye && !m.winner;
  const isPlayed   = !!m.winner && m.winner !== BYE;

  let card = 'match-card';
  if (isBye)       card += ' bye-card';
  else if (isPlayed)    card += ' played';
  else if (isPlayable)  card += ' playable';
  else             card += ' pending';

  const click = isPlayable ? `onclick="openScoreModal(${r},${i})"` : '';

  const nameA = m.a === BYE ? 'BYE' : (m.a || '?');
  const nameB = m.b === BYE ? 'BYE' : (m.b || '?');
  const emA = !m.a || m.a === BYE, emB = !m.b || m.b === BYE;

  let clsA = 'mc-player' + (emA ? ' empty' : '');
  let clsB = 'mc-player' + (emB ? ' empty' : '');
  if (isPlayed) {
    if (m.winner === m.a) { clsA += ' winner'; clsB += ' loser'; }
    else                   { clsB += ' winner'; clsA += ' loser'; }
  }

  const sA = m.scoreA !== null ? m.scoreA : '';
  const sB = m.scoreB !== null ? m.scoreB : '';

  return `<div class="match-slot">
    <div class="${card}" ${click}>
      <div class="${clsA}"><span class="mc-name">${nameA}</span><span class="mc-score">${sA}</span></div>
      <div class="${clsB}"><span class="mc-name">${nameB}</span><span class="mc-score">${sB}</span></div>
    </div>
  </div>`;
}

function updateProgress() {
  let total = 0, done = 0;
  S.bracket.forEach(round => round.forEach(m => {
    if (m.a && m.b && m.a !== BYE && m.b !== BYE) { total++; if (m.winner) done++; }
  }));
  document.getElementById('bracket-prog').textContent = `${done} / ${total} partite`;
}

function checkDone() {
  const fin = S.bracket[S.numRounds - 1][0];
  if (fin.winner && fin.winner !== BYE) showWinnerScreen(fin.winner);
}

/* ── SCREENS ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showBracketScreen() {
  document.getElementById('bracket-title').textContent = S.name.toUpperCase();
  renderBracket();
  updateProgress();
  showScreen('screen-bracket');
}

function showWinnerScreen(champion) {
  // Find runner-up (loser of final)
  const fin = S.bracket[S.numRounds - 1][0];
  const runner = (fin.winner === fin.a) ? fin.b : fin.a;
  document.getElementById('w-champion').textContent = champion;
  document.getElementById('w-event-name').textContent = S.name.toUpperCase();
  document.getElementById('w-runner').textContent = runner || '';
  spawnConfetti();
  showScreen('screen-winner');
}

function spawnConfetti() {
  const box = document.getElementById('confetti');
  box.innerHTML = '';
  const colors = ['#00ff88','#ffd700','#ff6b6b','#4ecdc4','#a78bfa','#fb923c'];
  for (let i = 0; i < 70; i++) {
    const b = document.createElement('div');
    b.className = 'bit';
    const sz = 6 + Math.random() * 8;
    b.style.cssText = `left:${Math.random()*100}%;width:${sz}px;height:${sz*(.4+Math.random()*.6)}px;
      background:${colors[i % colors.length]};animation-duration:${2.5+Math.random()*3}s;
      animation-delay:${Math.random()*2}s;opacity:${.7+Math.random()*.3};transform:rotate(${Math.random()*360}deg)`;
    box.appendChild(b);
  }
}

/* ── ACTIONS ── */
function onResumeYes() {
  document.getElementById('modal-resume').classList.remove('open');
  showBracketScreen();
  checkDone();
}
function onResumeNo() {
  document.getElementById('modal-resume').classList.remove('open');
  S = null; localStorage.removeItem(STORE_KEY);
  showScreen('screen-setup');
}
function resetTournament() {
  if (!confirm('Resettare il torneo? Tutti i dati andranno persi.')) return;
  S = null; localStorage.removeItem(STORE_KEY);
  showScreen('screen-setup');
}
function newTournament() {
  S = null; localStorage.removeItem(STORE_KEY);
  document.getElementById('confetti').innerHTML = '';
  showScreen('screen-setup');
}
function printBracket() {
  window.print();
}

/* ── INIT ── */
(function init() {
  document.body.classList.add('no-trans');
  refreshSetup();
  const saved = load();
  if (saved && saved.bracket) {
    S = saved;
    const fin = S.bracket[S.numRounds - 1][0];
    if (fin.winner && fin.winner !== BYE) {
      showWinnerScreen(fin.winner);
    } else {
      document.getElementById('modal-resume-msg').textContent =
        `Torneo "${S.name}" in corso. Vuoi riprendere?`;
      document.getElementById('modal-resume').classList.add('open');
      showScreen('screen-bracket');
    }
  } else {
    showScreen('screen-setup');
  }
  requestAnimationFrame(() => document.body.classList.remove('no-trans'));
})();
</script>
